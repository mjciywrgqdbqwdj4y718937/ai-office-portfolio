<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>别墅区 · 高模查看器</title>
<style>
  :root{--bg:#0b0d12;--panel:#151922;--line:#242a36;--fg:#e9eef7;--dim:#8b95a7;--accent:#5b8cff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
            font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  canvas{display:block}
  .panel{position:fixed;top:14px;left:14px;background:rgba(21,25,34,.92);border:1px solid var(--line);
         border-radius:12px;padding:14px 16px;backdrop-filter:blur(12px);width:250px;font-size:12.5px}
  .panel h1{font-size:14px;font-weight:600;margin-bottom:2px}
  .panel .sub{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .row label{flex:0 0 58px;color:var(--dim);font-size:11.5px}
  .row input[type=range]{flex:1;accent-color:var(--accent);height:3px}
  .row b{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  button{background:#1d2432;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:11px;
         padding:6px 9px;border-radius:6px;cursor:pointer;transition:.14s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#0b0d12;font-weight:600}
  .stat{position:fixed;top:14px;right:14px;background:rgba(21,25,34,.92);border:1px solid var(--line);
        border-radius:10px;padding:10px 14px;font-size:11.5px;color:var(--dim);text-align:right;line-height:1.9}
  .stat b{color:var(--fg);font-weight:500}
  .tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--dim);
       background:rgba(21,25,34,.86);border:1px solid var(--line);border-radius:20px;padding:6px 16px}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;
        font-size:13px;color:var(--dim);text-align:center;line-height:2}
</style></head><body>
<div id="load">正在加载…<br><span style="font-size:11px;opacity:.6" id="pct"></span></div>

<div class="panel">
  <h1>别墅区 · 高模</h1>
  <div class="sub">左键旋转 · 滚轮缩放 · 右键平移</div>
  <div class="row"><label>金属感</label><input id="metal" type="range" min="0" max="100" value="8"><b id="metalV">0.08</b></div>
  <div class="row"><label>粗糙度</label><input id="rough" type="range" min="0" max="100" value="72"><b id="roughV">0.72</b></div>
  <div class="row"><label>环境亮</label><input id="env" type="range" min="20" max="220" value="120"><b id="envV">1.2</b></div>
  <div class="row"><label>曝光</label><input id="exp" type="range" min="40" max="200" value="100"><b id="expV">1.0</b></div>
  <div class="btns">
    <button data-view="front" class="on">正面</button>
    <button data-view="side">侧面</button>
    <button data-view="top">俯视</button>
    <button id="wire">线框</button>
    <button id="grid" class="on">网格</button>
  </div>
</div>

<div class="stat">
  <div>面数 <b id="tris">—</b></div>
  <div>尺寸 <b id="size">—</b></div>
  <div>帧率 <b id="fps">—</b></div>
</div>
<div class="tip">拖动查看 · 左侧可调材质与视角</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/gh/mjciywrgqdbqwdj4y718937/ai-office-portfolio@main/villa.glb";

if (typeof THREE === 'undefined') {
  document.getElementById('load').innerHTML =
    'three.js 加载失败<br><span style="font-size:11px;opacity:.7">检查网络后刷新，或稍等重试</span>';
  throw new Error('three missing');
}

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151c);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;

const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x2a3326, 1.0);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff4e0, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.9);
rim.position.set(-6,4,-8);
scene.add(rim);

const grid = new THREE.GridHelper(30, 30, 0x33415a, 0x1f2937);
scene.add(grid);

let meshes = [];
const matParams = { metalness:0.08, roughness:0.72 };
function applyMat(){
  meshes.forEach(m => (Array.isArray(m.material)?m.material:[m.material]).forEach(mt => {
    mt.metalness = matParams.metalness;
    mt.roughness = matParams.roughness;
    mt.needsUpdate = true;
  }));
}

let model=null, centerVec=new THREE.Vector3(), radius=1;

function onLoaded(g){
  model = g.scene;
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      meshes.push(o);
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m => {
        if (o.geometry.attributes.color) { m.vertexColors = true; }
        else if (!m.map) { m.color = new THREE.Color(0xb9bcc4); }
      });
    }
  });
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  box.getCenter(centerVec);
  const sizeV = box.getSize(new THREE.Vector3());
  radius = Math.max(sizeV.x, sizeV.y, sizeV.z)/2;

  let tris = 0;
  model.traverse(o => { if (o.isMesh && o.geometry) {
    const g2 = o.geometry;
    tris += (g2.index ? g2.index.count : g2.attributes.position.count)/3;
  }});
  document.getElementById('tris').textContent = Math.round(tris).toLocaleString();
  document.getElementById('size').textContent =
    `${sizeV.x.toFixed(1)}×${sizeV.y.toFixed(1)}×${sizeV.z.toFixed(1)}`;

  key.position.copy(centerVec).add(new THREE.Vector3(radius*2, radius*3, radius*2));
  const d = radius*2.2;
  Object.assign(key.shadow.camera, {left:-d,right:d,top:d,bottom:-d,near:0.1,far:radius*12});
  key.shadow.camera.updateProjectionMatrix();
  key.target.position.copy(centerVec);
  scene.add(key.target);

  grid.position.y = box.min.y - 0.01;
  document.getElementById('load').style.display = 'none';
  setView('front');
}

document.getElementById('pct').textContent = '正在下载模型（约 0.5 MB）…';
new THREE.GLTFLoader().load(MODEL_URL, onLoaded,
  xhr => {
    if (xhr.total) document.getElementById('pct').textContent =
      `${Math.round(xhr.loaded/xhr.total*100)}%  (${(xhr.loaded/1024).toFixed(0)} KB)`;
  },
  err => {
    document.getElementById('load').innerHTML =
      '模型加载失败<br><span style="font-size:11px;opacity:.7">刷新重试，或换网络环境</span>';
    console.error(err);
  }
);

const VIEWS = { front:{dir:[0.75,0.42,1.0]}, side:{dir:[1.0,0.35,0.05]}, top:{dir:[0.05,1.0,0.05]} };
let anim=null;
function setView(k){
  const v = VIEWS[k]; if (!v || !model) return;
  const dir = new THREE.Vector3(...v.dir).normalize();
  const dist = radius*3.1;
  const p1 = centerVec.clone().add(dir.multiplyScalar(dist));
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const start = performance.now(), dur = 550;
  anim = () => {
    const x = Math.min(1,(performance.now()-start)/dur);
    const e = x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
    camera.position.lerpVectors(p0,p1,e);
    controls.target.lerpVectors(t0,centerVec,e);
    controls.update();
    if (x>=1) anim=null;
  };
}
document.querySelectorAll('[data-view]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); setView(b.dataset.view);
  };
});

function bindSlider(id,out,fn){
  const el=document.getElementById(id);
  el.oninput=()=>{document.getElementById(out).textContent=fn(+el.value);};
  el.oninput();
}
bindSlider('metal','metalV',v=>{matParams.metalness=v/100;applyMat();return (v/100).toFixed(2);});
bindSlider('rough','roughV',v=>{matParams.roughness=v/100;applyMat();return (v/100).toFixed(2);});
bindSlider('env','envV',v=>{hemi.intensity=v/100;key.intensity=2.4*(v/100);return (v/100).toFixed(1);});
bindSlider('exp','expV',v=>{renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=v/100;return (v/100).toFixed(1);});

document.getElementById('wire').onclick=e=>{
  const on=!e.target.classList.contains('on'); e.target.classList.toggle('on',on);
  meshes.forEach(m=>(Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>{mt.wireframe=on;}));
};
document.getElementById('grid').onclick=e=>{
  const on=!e.target.classList.contains('on'); e.target.classList.toggle('on',on); grid.visible=on;
};

let last=performance.now(),frames=0,acc=0;
(function loop(){
  requestAnimationFrame(loop);
  if (anim) anim();
  controls.update();
  renderer.render(scene,camera);
  const now=performance.now(); acc+=now-last; last=now; frames++;
  if(acc>500){document.getElementById('fps').textContent=Math.round(frames/(acc/1000));
    frames=0;acc=0;}
})();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
addEventListener('keydown',e=>{
  if(e.key==='1')document.querySelector('[data-view="front"]').click();
  if(e.key==='2')document.querySelector('[data-view="side"]').click();
  if(e.key==='3')document.querySelector('[data-view="top"]').click();
});
</script>
</body></html>
